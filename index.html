function pie(a){const t=a.reduce((x,y)=>x+Math.max(0,y[1]),0);if(!t)return'';let s=0,h='';a.forEach((x,i)=>{if(x[1]<=0)return;const f1=s/t*6.2832,f2=(s+x[1])/t*6.2832;s+=x[1];const c=x[2]||CL[i%13];h+=x[1]>=t-1e-9?`<circle cx="70" cy="70" r="60" fill="${c}"/>`:`<path d="M70 70L${(70+60*Math.sin(f1)).toFixed(2)} ${(70-60*Math.cos(f1)).toFixed(2)}A60 60 0 ${f2-f1>3.1416?1:0} 1 ${(70+60*Math.sin(f2)).toFixed(2)} ${(70-60*Math.cos(f2)).toFixed(2)}Z" fill="${c}" stroke="var(--cd)" stroke-width="1"/>`});
return`<svg viewBox="0 0 140 140" style="max-width:230px;margin:auto">${h}</svg><table>${a.filter(x=>x[1]>0).map(x=>`<tr><td><span class="sw" style="background:${x[2]||CL[a.indexOf(x)%13]}"></span>${x[0]}</td><td class="n">${M(x[1])}</td><td class="n mu">${(x[1]/t*100).toFixed(1)}%</td></tr>`).join('')}</table>`}
const nav=()=>{$('nv').innerHTML=['حاسبة','السنة','الأشهر','البيانات','إعدادات'].map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};go()">${t}</button>`).join('')};
function go(){$('nl').checked=!!S.nl;$('us').checked=!!S.usd;$('rn').checked=!S.nr;$('sh').checked=!!S.sh;nav();[calc,yr,mon,data,set][tab]();window.scrollTo(0,0)}
function calc(){const mo=Math.round(last12(ALL()).reduce((s,e)=>s+e.n,0)/12)||900;$('v').innerHTML=`<div class="cd"><div class="g2"><div><label>عدد الصواني</label><input id="n" type="number" value="100" oninput="rc()"></div><div><label>سعر البيع للصينية</label><input id="p" type="number" value="${S.price}" oninput="rc()"></div><div><label>صواني الشهر</label><input id="mo" type="number" value="${mo}" oninput="rc()"></div></div></div><div id="r"></div>`;rc()}
function rc(){const n=+$('n').value||0,p=+$('p').value||0,c=cost(n,null,(S.nr?0:S.rent)*n/(+$('mo').value||1)),pr=n*p-c.tot;
$('r').innerHTML=`<div class="cd"><div class="mu">تكلفة الصينية</div><div class="big">${M(n?c.tot/n:0)}</div><div class="mu">الإجمالي ${M(c.tot)} · الربح <b class="${pr>=0?'ps':'ng'}">${M(pr)}</b> (${M(n?pr/n:0)} للصينية)</div></div><div class="cd">${pie([...c.a,['الربح',pr,'#1d7a45']])}</div>`}
const MN=m=>['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][+m];
const last12=l=>{const e=l[l.length-1].d,[y,m]=[+e.slice(0,4),+e.slice(5,7)];const k=(y-1)*12+m;return l.filter(x=>+x.d.slice(0,4)*12+ +x.d.slice(5,7)>k)};
const kp=(a)=>`<div class="kp"><div><span class="mu">إجمالي الصواني</span><b>${f(a.n)}</b></div><div><span class="mu">المبيعات</span><b>${M(a.r)}</b></div><div><span class="mu">التكلفة</span><b>${M(a.c)}</b></div><div><span class="mu">الربح</span><b class="${a.r>=a.c?'ps':'ng'}">${M(a.r-a.c)}</b></div></div>`;
function yr(){const l=ALL();if(!l.length){$('v').innerHTML='<div class="cd">لا توجد بيانات.</div>';return}
const tm=Array(13).fill(0),cn=Array(13).fill(0);l.forEach(e=>{const m=+e.d.slice(5,7);tm[m]+=e.n;cn[m]++});
if(!SM){let b=1e9;for(let m=1;m<=12;m++)if(cn[m]>10&&tm[m]/cn[m]<b){b=tm[m]/cn[m];SM=m}}
const Q={};l.forEach(e=>{const y=+e.d.slice(0,4),m=+e.d.slice(5,7),s=m>=SM?y:y-1,i=(m-SM+12)%12;(Q[s]=Q[s]||Array(12).fill(null))[i]=(Q[s][i]||0)+e.n});
const ss=Object.keys(Q).sort(),mx=Math.max(...ss.flatMap(s=>Q[s].filter(v=>v)));const X=i=>30+i*24.5,Y=v=>140-v/mx*125;
const lines=ss.map((s,k)=>{const pts=Q[s].map((v,i)=>v==null?null:X(i).toFixed(1)+','+Y(v).toFixed(1)).filter(x=>x);return`<polyline fill="none" stroke="${CL[k]}" stroke-width="2.2" points="${pts.join(' ')}"/>`}).join('');
const lab=Array.from({length:12},(_,i)=>`<text x="${X(i)}" y="156" font-size="9" text-anchor="middle" fill="var(--mu)">${(SM+i-1)%12+1}</text>`).join('');
const gr=[0,.5,1].map(q=>`<line x1="26" x2="322" y1="${Y(mx*q)}" y2="${Y(mx*q)}" stroke="var(--bd)"/><text x="22" y="${Y(mx*q)+3}" font-size="9" text-anchor="end" fill="var(--mu)">${f(mx*q)}</text>`).join('');
const B=[[45,'حتى 45'],[75,'46 إلى 75'],[100,'76 إلى 100'],[1e9,'أكثر من 100']].map(x=>({l:x[1],m:x[0],a:[]}));l.forEach(e=>B.find(x=>e.n<=x.m).a.push(e));
$('v').innerHTML=`<h2>آخر سنة</h2>${kp(A(last12(l)))}<div class="mu">كل المدة: ${f(A(l).n)} صينية في ${l.length} يوماً. المبيعات بسعر ${S.price} للصينية.</div>
<h2>الأداء السنوي</h2><div class="cd"><label>بداية الموسم</label><select onchange="SM=+this.value;yr()">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1==SM?'selected':''}>${i+1} · ${MN(i+1)}</option>`).join('')}</select>
<svg viewBox="0 0 330 165">${gr}${lines}${lab}</svg><div>${ss.map((s,k)=>`<span class="mu"><span class="sw" style="background:${CL[k]}"></span>موسم ${s}/${(+s+1)%100}&nbsp;&nbsp;</span>`).join('')}</div><div class="mu">إجمالي الصواني لكل شهر من بداية الموسم إلى نهايته.</div></div>
<h2>حسب حجم اليوم</h2><div class="cd"><table><tr><th>الحجم</th><th class="n">أيام</th><th class="n">تكلفة/ص</th><th class="n">ربح/ص</th></tr>${B.filter(b=>b.a.length).map(b=>{const a=A(b.a);return`<tr><td>${b.l}</td><td class="n">${a.d}</td><td class="n">${M(a.c/a.n)}</td><td class="n ${a.r>=a.c?'ps':'ng'}">${M((a.r-a.c)/a.n)}</td></tr>`}).join('')}</table></div>`}
function mon(){const l=ALL();if(!l.length){$('v').innerHTML='<div class="cd">لا توجد بيانات.</div>';return}
const ks=[...new Set(l.map(e=>e.d.slice(0,7)))].sort().reverse();if(!ks.includes(MS))MS=ks[0];
const ml=l.filter(e=>e.d.slice(0,7)==MS),a=A(ml),c=[0,1,2,3].map(i=>ml.reduce((s,e)=>s+(e.c?e.c[i]:0),0)),mx=Math.max(...ml.map(e=>e.n));
const bars=ml.map(e=>{const d=+e.d.slice(8),h=e.n/mx*110;return`<rect x="${5+(d-1)*9.3}" y="${125-h}" width="7" height="${h}" rx="1.5" fill="var(--ac)"${e.es?' opacity=".45"':''}/><text x="${8.5+(d-1)*9.3}" y="137" font-size="6" text-anchor="middle" fill="var(--mu)">${d%5==0||d==1?d:''}</text>`}).join('');
$('v').innerHTML=`<div class="cd"><label>الشهر</label><select onchange="MS=this.value;mon()">${ks.map(k=>`<option value="${k}" ${k==MS?'selected':''}>${k.slice(0,4)} · ${MN(k.slice(5))}</option>`).join('')}</select></div>
${kp(a)}<div class="mu">${a.d} يوم إنتاج · المتوسط ${f(a.n/a.d)} للصينيات في اليوم · بالبقدونس ${f(c[0])} · خاصة ${f(c[1])} · صغيرة ${f(c[2])} · عادية ${f(c[3])}</div>
<div class="cd"><svg viewBox="0 0 300 142">${bars}</svg><div class="mu">الصواني في كل يوم من الشهر</div></div>
<h2>آخر 12 شهراً</h2><div class="cd"><table><tr><th>الشهر</th><th class="n">صواني</th><th class="n">مبيعات</th><th class="n">تكلفة</th><th class="n">ربح</th></tr>${ks.slice(0,12).map(k=>{const x=A(l.filter(e=>e.d.slice(0,7)==k));return`<tr><td>${k.slice(2,4)}/${k.slice(5)}</td><td class="n">${f(x.n)}</td><td class="n">${M(x.r)}</td><td class="n">${M(x.c)}</td><td class="n ${x.r>=x.c?'ps':'ng'}">${M(x.r-x.c)}</td></tr>`}).join('')}</table></div>`}
function data(){const d=new Date().toISOString().slice(0,10),l=ALL();
$('v').innerHTML=`<div class="cd"><div class="g2"><div><label>التاريخ</label><input id="d" type="date" value="${d}"></div><div><label>عدد الصواني</label><input id="dn" type="number"></div></div><label>سعر البيع</label><input id="dp" type="number" placeholder="${S.price}"><button class="btn" onclick="add()">إضافة</button></div>
<div class="cd"><label>لصق بيانات: تاريخ,عدد,سعر</label><textarea id="ta" placeholder="2026-11-05,120,600"></textarea><button class="btn" onclick="imp()">استيراد</button> <button class="btn s" onclick="exp()">تصدير</button></div>
<div class="cd"><div class="mu">${l.length} يوم محفوظ، المقدّرة بعلامة ~</div><table>${[...l].reverse().slice(0,40).map(e=>`<tr><td>${e.d}${e.es?' ~':''}${e.eid?' عيد':''}${e.sh?' ترحيل':''}</td><td class="n">${e.n}</td><td class="n mu">${e.p||''}</td><td><button class="x" onclick="del('${e.d}')">×</button></td></tr>`).join('')}</table></div>`}
function put(d,n,p){if(!d||!(n>0))return;E=E.filter(e=>e.d!=d);E.push({d,n,p:p||0,es:0})}
function add(){put($('d').value,+$('dn').value,+$('dp').value);sv();data()}
function del(d){E=E.filter(e=>e.d!=d);sv();data()}
function nd(s){s=s.trim();let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''}
function imp(){let c=0;$('ta').value.split('\n').forEach(l=>{const q=l.split(/[,;\t]/),d=nd(q[0]||'');if(d){put(d,parseFloat(q[1]),parseFloat(q[2])||0);c++}});sv();data();alert('تم استيراد '+c+' سطر')}
function exp(){$('ta').value=ALL(1).map(e=>`${e.d},${e.n}${e.p?','+e.p:''}`).join('\n')}
function set(){$('v').innerHTML=`<div class="cd">${Object.keys(D).map(k=>`<label>${L[k]}</label><input type="number" step="any" value="${S[k]}" onchange="S['${k}']=+this.value;sv()">`).join('')}<button class="btn s" onclick="if(confirm('استرجاع القيم الأصلية؟')){S={...D,nl:S.nl,usd:S.usd,nr:S.nr,sh:S.sh};sv();set()}">استرجاع القيم الأصلية</button></div><div class="mu">العمال: حتى 45 صينية 2×3500 + 1×1750، حتى 75: +1، حتى 100: +1، وفوق 100: عامل 1750 إضافي. من تقديري: البيض، الملح والفانيلا، المياه، الكهرباء والغاز، وزن تنكة الزيت الصلب، الضريبة، البنزين للصينية، وسعر البيع.</div>`}
go();
</script></body></html>
